name: Dashboard

# Builds the dashboard and publishes it to GitHub Pages, together with every
# report committed to this repository. Nothing is hosted outside GitHub: the
# site and the runs it reads are the same artifact.
#
# Runs on a push that changes the dashboard, and when a workflow that writes to
# reports/ finishes — neither publishing a run nor deleting one can announce
# itself with a push, because the token they commit with is barred from starting
# workflows.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "reports/**"
      - ".github/workflows/pages.yaml"
  pull_request:
    paths: ["dashboard/**"]
  # A published run commits the report with the default GITHUB_TOKEN, and GitHub
  # deliberately does not start a workflow from a push made with that token --
  # it is how it stops a workflow triggering itself forever. So the push above
  # never fires for a published run, and the report reached the repository while
  # the site went on serving the deploy before it. This trigger fires on those
  # workflows *finishing*, which is not a push and is not suppressed. Deleting a
  # run needs it for the same reason, and more sharply: without a rebuild the
  # site would go on serving runs the repository no longer holds.
  workflow_run:
    workflows: ["Verify metadata", "Delete published runs"]
    types: [completed]
  workflow_dispatch:

# The build job reads the repository and nothing else; the deploy job names
# what it needs itself. Without this the build would run with whatever the
# repository's default token permissions happen to be.
permissions:
  contents: read

env:
  NODE_VERSION: 24

# One deploy at a time. A Pages deploy replaces the whole site, so two in
# flight would race; a queued one is still worth running, because it carries a
# report the earlier one did not.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Whether there is anything to deploy. A workflow_run fires for every verify
  # run, including one that only looked, and for every dry-run prune; each used
  # to rebuild and redeploy an unchanged site. A run that published or deleted
  # pushed a commit, so the default branch has moved past the sha the run
  # started from; one that did neither left it where it was. That is the test.
  decide:
    name: Anything to deploy?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STARTED_FROM: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" != workflow_run ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CONCLUSION" != success ]; then
            echo 'A run that failed published nothing.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0
          fi
          head=$(gh api "repos/$REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          if [ "$head" = "$STARTED_FROM" ]; then
            echo "The run started from $STARTED_FROM and the branch is still there: it published nothing."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo "The branch moved from $STARTED_FROM to $head since the run started."
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: decide
    if: ${{ needs.decide.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A workflow_run event carries the sha the verify run *started* from,
          # which is the commit before it published. The report is on the branch
          # head, so the branch is what has to be built.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      # Blocking, and deliberately so: nothing here can be typechecked on a
      # machine with an older Node, so this is the first place a wrong component
      # prop or a mistyped report field is caught.
      - name: Typecheck
        run: npm run typecheck
        working-directory: dashboard

      # Covers the code that rewrites the 2i-HITL sheets — the team's record of
      # who checked what, where a bug corrupts years of sign-offs.
      - name: Test
        run: npm test
        working-directory: dashboard

      # The runs the site will serve, copied in so they are part of the same
      # deploy. They are tracked in this repository, so a checkout has them.
      - name: Bundle the published runs
        run: |
          mkdir -p dashboard/public/reports
          if compgen -G 'reports/*.json' > /dev/null; then
            cp reports/*.json dashboard/public/reports/
          else
            echo 'No runs have been published yet; the site will say so.'
          fi

      # A project site is served from /<repo>/, so every asset and fetch has to
      # be built for that path. Taken from the repository name rather than
      # written down, so a fork publishes to its own path unchanged.
      - name: Build
        run: npm run generate
        working-directory: dashboard
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      # Pages with the Actions source serves the artifact as-is and does not run
      # Jekyll. This is insurance for the day someone switches the source back to
      # a branch, where Jekyll would drop Nuxt's _nuxt/ directory and serve a
      # blank page with no error.
      - name: Keep Jekyll out of it
        run: touch dashboard/.output/public/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/.output/public

  deploy:
    name: Deploy
    # A pull request builds to prove it still compiles; only the default branch
    # is published. A workflow_run always builds the default branch (see the
    # checkout above); a push or a dispatch has to be *on* it, or a branch
    # dispatched "to see the build" would replace the live site.
    if: ${{ github.event_name == 'workflow_run'
         || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
