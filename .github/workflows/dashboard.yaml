name: Dashboard

# Builds the read-only dashboard. The build is the check: nothing here can be
# verified on a machine with an older Node, so CI is where it is proven.

on:
  push:
    branches: [main]
    paths: ["dashboard/**"]
  pull_request:
    paths: ["dashboard/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "publish the built site to S3"
        type: boolean
        default: false

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking, and deliberately so: nothing here can be typechecked on a
      # machine with an older Node, so this is the first place a wrong component
      # prop or a mistyped report field is caught.
      - name: Typecheck
        run: npm run typecheck

      # A static site: the report is a file it fetches, and there is no backend.
      # The report url is baked in at build time; the default is relative, which
      # is why the site and the reports share one bucket.
      - name: Build
        run: npm run generate
        env:
          NUXT_PUBLIC_REPORT_URL: ${{ vars.REPORT_URL || '/reports/latest.json' }}

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/.output/public

      - name: Configure AWS credentials
        if: ${{ inputs.deploy }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # One bucket holds both: the site at the root, the runs under reports/.
      # Those are written by the verify workflow, so --delete must not touch them.
      - name: Deploy
        if: ${{ inputs.deploy }}
        run: |
          aws s3 sync .output/public "s3://${{ secrets.SITE_BUCKET }}" --delete --exclude "reports/*"
