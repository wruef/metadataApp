name: Tests

# The checks themselves, on every push. The dashboard's own tests run in the
# Pages workflow, where they block a deploy; nothing ran the python tests at all
# until this existed, so a broken check reached a verification run before it
# reached anybody's attention.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "params/**"
      - "2i_HITL/**"
      - "pyproject.toml"
      # tests/test_pins.py reads these three, so a change to any of them has to
      # run it. Without them a pin could be bumped in constraints.txt alone and
      # the test that exists to catch that would never be executed.
      - "constraints.txt"
      - "environment.yml"
      - ".github/workflows/verify.yaml"
      - ".github/workflows/tests.yaml"
      # tests/test_commit_action.py runs the publish step's shell for real,
      # against two clones of a throwaway repository. It is the only place that
      # shell is ever executed off a runner, and the conflict it resolves
      # cannot be arranged on purpose, so a change to the action has to run it.
      - ".github/actions/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "params/**"
      - "2i_HITL/**"
      - "pyproject.toml"
      - "constraints.txt"
      - "environment.yml"
      - ".github/workflows/verify.yaml"
      # tests/test_commit_action.py runs the publish step's shell for real,
      # against two clones of a throwaway repository. It is the only place that
      # shell is ever executed off a runner, and the conflict it resolves
      # cannot be arranged on purpose, so a change to the action has to run it.
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version a verification run uses, and the oldest the package claims
        # to support. Comparison is exact to the last digit, so a difference
        # between the two is worth knowing about before a season depends on it.
        # The two resolve different pandas majors, which is the point: 3.11 gets
        # pandas 3 and 3.10 gets pandas 2, and this matrix is where that shows.
        python: ["3.11", "3.10"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Unpinned on purpose, unlike verify.yaml. This matrix is the early
      # warning: resolving freely is what caught pandas 3 removing a function
      # this code used, on the python that resolves pandas 3, while the other
      # entry still passed. Installing against constraints.txt would have
      # hidden that until a published run hit it.
      - name: Install the package and its test dependencies
        run: pip install -e '.[test]'

      # Some tests read params/ and 2i_HITL/ from the working directory, which
      # is the point: they check the team's real sheets rather than a fixture
      # that can agree with a bug.
      - name: Run the tests
        run: pytest -q

      - name: Record what it ran against
        if: always()
        run: pip list --format=freeze | grep -Ei '^(pandas|numpy|pdfplumber|openpyxl|requests|beautifulsoup4)=' || true
