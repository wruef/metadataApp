name: Verify metadata

# Runs every check against a chosen state of the repositories and writes one
# report. There is no schedule: a run is an event someone chooses, usually once
# a season after the cruise, and occasionally to check a branch before it merges.

on:
  workflow_dispatch:
    inputs:
      asset_management_ref:
        description: "asset-management ref to verify (branch, tag or sha)"
        default: master
      asset_management_repo:
        description: "asset-management repository — a fork, to check changes before they are pushed upstream"
        default: oceanobservatories/asset-management
      calibration_files_ref:
        description: "calibrationFiles ref"
        default: master
      baseline_ref:
        description: "optional: a second ref to compare against, e.g. master. Leave blank to skip."
        default: ""
      publish:
        description: "commit the report so the dashboard serves it"
        type: boolean
        default: false
      replace_production:
        description: "make this run the one the dashboard opens on. Ignored for a production run, which always becomes that. Tick it only to promote a branch result to the figures everyone reads."
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  REPORT: reports/report.json
  COMPARISON: reports/comparison.json
  # The published deployment history, beside the report rather than inside it:
  # the dashboard fetches it only when a reviewer opens the history view.
  HISTORY: reports/history.json

# No concurrency group, on purpose. A group holds one running and ONE pending
# run and cancels a third arrival, so a busy afternoon of publishes lost runs.
# Publishing instead rebases over whatever landed meanwhile and resolves the one
# file two runs both write -- the index -- by rebuilding it from the reports on
# disk. See .github/actions/commit-reports.

jobs:
  verify:
    name: Run all checks
    runs-on: ubuntu-latest
    permissions:
      # Publishing commits the report to this repository; nothing else writes.
      contents: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      # Cloned rather than read over the API: the calibration comparison probes
      # the filesystem for vendor files, so reading remotely would mean ~1,300
      # downloads per run. Shallow, because only the working tree is needed —
      # but a clone, not a copy: without .git there is no commit to record, and
      # a run that cannot name the state it read cannot be compared against.
      - name: Clone asset-management
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.asset_management_repo }}
          ref: ${{ inputs.asset_management_ref }}
          path: repos/asset-management
          fetch-depth: 1

      - name: Clone calibrationFiles
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/calibrationFiles
          ref: ${{ inputs.calibration_files_ref }}
          path: repos/calibrationFiles
          fetch-depth: 1

      - name: Clone deployments
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/deployments
          ref: main
          path: repos/deployments
          fetch-depth: 1

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Against constraints.txt, which pins the two libraries that parse and
      # compare the numbers. A published run is what everyone reads, so it is
      # reproducible on purpose. The Tests workflow deliberately does not do
      # this -- see the note there.
      - name: Install package
        run: pip install . -c constraints.txt

      # Inputs reach the shell through the environment rather than being pasted
      # into the script: a ref with a quote in it would otherwise end the string
      # early and fail the run with a syntax error.
      - name: Run all checks
        env:
          REPO: ${{ inputs.asset_management_repo }}
          REF: ${{ inputs.asset_management_ref }}
          CAL_REF: ${{ inputs.calibration_files_ref }}
        run: |
          verify-metadata \
            --asset-management "$REPO@$REF" \
            --calibration-files "OOI-CabledArray/calibrationFiles@$CAL_REF" \
            --deployments 'OOI-CabledArray/deployments@main' \
            --clones repos \
            --out "$REPORT" \
            --history-out "$HISTORY"

      # Verifying a branch in isolation produces a report; verifying it against
      # a baseline produces an answer about whether the change is safe. Both runs
      # use the same checks, which is what lets a moved row be attributed to the
      # data rather than to the check.
      - name: Clone the baseline
        if: ${{ inputs.baseline_ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.asset_management_repo }}
          ref: ${{ inputs.baseline_ref }}
          path: baseline/asset-management
          fetch-depth: 1

      - name: Run the baseline and compare
        if: ${{ inputs.baseline_ref != '' }}
        env:
          REPO: ${{ inputs.asset_management_repo }}
          BASELINE: ${{ inputs.baseline_ref }}
          CAL_REF: ${{ inputs.calibration_files_ref }}
        run: |
          # the other two repositories are the same in both runs
          ln -s "$PWD/repos/calibrationFiles" baseline/calibrationFiles
          ln -s "$PWD/repos/deployments" baseline/deployments
          verify-metadata \
            --asset-management "$REPO@$BASELINE" \
            --calibration-files "OOI-CabledArray/calibrationFiles@$CAL_REF" \
            --deployments 'OOI-CabledArray/deployments@main' \
            --clones baseline \
            --out reports/baseline.json
          compare-metadata reports/baseline.json "$REPORT" --out "$COMPARISON"

      # Kept whether or not it is published, so a run that was only a look can
      # still be read back.
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: metadata-report
          path: reports/

      # Published runs live in git rather than in a bucket. They are what the
      # dashboard serves, the history is the provenance record, and an earlier
      # run stays reachable as a baseline without anything to administer.
      # Every published run is committed under its own name and added to the
      # index, which is what lets the dashboard's run picker open it. Only a
      # production run also becomes latest.json -- the figures every reader
      # sees, and the baseline every later comparison is measured against.
      #
      # That is why publishing a branch run is no longer refused. It used to be,
      # because publishing meant replacing those figures; now it means adding a
      # run to the picker and moving nothing. A branch check is a question, and
      # a question you can open in the dashboard is worth more than one you
      # download as a zip.
      # Only from the default branch. Dispatched from any other branch, the
      # report would be committed there: the site rebuilds from the default
      # branch and never shows it, and the run goes green all the same.
      - name: Stage the report
        if: ${{ inputs.publish && github.ref_name == github.event.repository.default_branch }}
        env:
          REPO: ${{ inputs.asset_management_repo }}
          REF: ${{ inputs.asset_management_ref }}
          CAL_REF: ${{ inputs.calibration_files_ref }}
          REPLACE: ${{ inputs.replace_production }}
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          cp "$REPORT" "reports/report_$stamp.json"
          index-metadata --report "$REPORT" --name "report_$stamp.json" \
            --index reports/index.json --out reports/index.json
          files="reports/index.json reports/report_$stamp.json"

          # Named for the run it belongs to, so the dashboard can reach the
          # comparison for whichever run is being read rather than only the
          # newest one.
          if [ -f "$COMPARISON" ]; then
            cp "$COMPARISON" "reports/comparison_$stamp.json"
            files="$files reports/comparison_$stamp.json"
          fi

          # The same, for the deployment history the run built. A reviewer
          # proposes it to their own fork of the deployments repository from the
          # dashboard, so it has to be reachable per run.
          if [ -f "$HISTORY" ]; then
            cp "$HISTORY" "reports/history_$stamp.json"
            files="$files reports/history_$stamp.json"
          fi

          production=false
          if [ "$REPO" = 'oceanobservatories/asset-management' ] \
             && [ "$REF" = master ] && [ "$CAL_REF" = master ]; then
            production=true
          fi
          # A production run always becomes latest.json, so replace_production
          # does nothing here and everything on a run that is not production,
          # where it promotes a branch result to the figures everyone reads.
          if [ "$production" = true ] || [ "$REPLACE" = true ]; then
            cp "$REPORT" reports/latest.json
            files="$files reports/latest.json"
            if [ -f "$HISTORY" ]; then
              cp "$HISTORY" reports/history-latest.json
              files="$files reports/history-latest.json"
            fi
            # The run the site opens on asks for a fixed name, as it does for
            # the report and the history. Without this the dashboard asked for
            # reports/comparison.json, which is gitignored and never committed,
            # so the Changes view was empty on the default run however many
            # baselines were run.
            if [ -f "$COMPARISON" ]; then
              cp "$COMPARISON" reports/comparison-latest.json
              files="$files reports/comparison-latest.json"
            else
              # This run had no baseline, so it has no changes to show. The
              # previous run's must not be left behind pretending to be this
              # one's.
              git rm -q --ignore-unmatch reports/comparison-latest.json
            fi
          else
            echo "::notice title=Published under its own name::report_$stamp.json is in the run" \
              "picker. latest.json is unchanged, because $REPO@$REF is not production."
          fi

          git add -f $files

      - name: Commit the report
        if: ${{ inputs.publish && github.ref_name == github.event.repository.default_branch }}
        uses: ./.github/actions/commit-reports
        with:
          branch: ${{ github.ref_name }}
          message: |
            Verification run ${{ env.STAMP }}

            asset-management ${{ inputs.asset_management_repo }}@${{ inputs.asset_management_ref }}
            calibrationFiles @${{ inputs.calibration_files_ref }}

      - name: Not published
        if: ${{ inputs.publish && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::warning title=Not published::publish was ticked, but this run was dispatched from" \
            "'${{ github.ref_name }}', not the default branch. The report is in the run's artifact;" \
            "dispatch from the default branch to publish it."

