name: Verify metadata

# Runs every check against a chosen state of the repositories and writes one
# report. There is no schedule: a run is an event someone chooses, usually once
# a season after the cruise, and occasionally to check a branch before it merges.

on:
  workflow_dispatch:
    inputs:
      asset_management_ref:
        description: "asset-management ref to verify (branch, tag or sha)"
        default: master
      asset_management_repo:
        description: "asset-management repository — a fork, to check changes before they are pushed upstream"
        default: oceanobservatories/asset-management
      calibration_files_ref:
        description: "calibrationFiles ref"
        default: master
      baseline_ref:
        description: "optional: a second ref to compare against, e.g. master. Leave blank to skip."
        default: ""
      publish:
        description: "commit the report so the dashboard serves it"
        type: boolean
        default: false
      publish_nonproduction:
        description: "allow publish from a ref other than production — replaces the figures everyone reads"
        type: boolean
        default: false

env:
  PYTHON_VERSION: 3.11
  REPORT: reports/report.json
  COMPARISON: reports/comparison.json

# A published run commits to the default branch, which starts the Pages deploy.
# Two runs publishing at once would race over that commit.
concurrency:
  group: verify-${{ inputs.publish }}
  cancel-in-progress: false

jobs:
  verify:
    name: Run all checks
    runs-on: ubuntu-latest
    permissions:
      # Publishing commits the report to this repository; nothing else writes.
      contents: write
    steps:
      # Publishing replaces latest.json, which is the figure every reader sees
      # and the baseline every later comparison is measured against. A run
      # against a branch is a question, not an answer, so publishing one has to
      # be asked for in as many words rather than left one tick box away.
      - name: Refuse to publish a run that is not production
        if: ${{ inputs.publish && !inputs.publish_nonproduction }}
        env:
          REPO: ${{ inputs.asset_management_repo }}
          REF: ${{ inputs.asset_management_ref }}
          CAL_REF: ${{ inputs.calibration_files_ref }}
        run: |
          if [ "$REPO" != "oceanobservatories/asset-management" ] \
             || [ "$REF" != "master" ] || [ "$CAL_REF" != "master" ]; then
            echo "::error::Refusing to publish $REPO@$REF (calibrationFiles@$CAL_REF)."
            echo "Publishing replaces reports/latest.json, which is what the dashboard shows"
            echo "as production and what later runs are compared against."
            echo "Run it without publish, or tick publish_nonproduction if that is what you mean."
            exit 1
          fi

      - name: Check out this repository
        uses: actions/checkout@v5

      # Cloned rather than read over the API: the calibration comparison probes
      # the filesystem for vendor files, so reading remotely would mean ~1,300
      # downloads per run. Shallow, because only the working tree is needed —
      # but a clone, not a copy: without .git there is no commit to record, and
      # a run that cannot name the state it read cannot be compared against.
      - name: Clone asset-management
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.asset_management_repo }}
          ref: ${{ inputs.asset_management_ref }}
          path: repos/asset-management
          fetch-depth: 1

      - name: Clone calibrationFiles
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/calibrationFiles
          ref: ${{ inputs.calibration_files_ref }}
          path: repos/calibrationFiles
          fetch-depth: 1

      - name: Clone deployments
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/deployments
          ref: main
          path: repos/deployments
          fetch-depth: 1

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: pip install .

      - name: Run all checks
        run: |
          verify-metadata \
            --asset-management '${{ inputs.asset_management_repo }}@${{ inputs.asset_management_ref }}' \
            --calibration-files 'OOI-CabledArray/calibrationFiles@${{ inputs.calibration_files_ref }}' \
            --deployments 'OOI-CabledArray/deployments@main' \
            --clones repos \
            --out "$REPORT"

      # Verifying a branch in isolation produces a report; verifying it against
      # a baseline produces an answer about whether the change is safe. Both runs
      # use the same checks, which is what lets a moved row be attributed to the
      # data rather than to the check.
      - name: Clone the baseline
        if: ${{ inputs.baseline_ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.asset_management_repo }}
          ref: ${{ inputs.baseline_ref }}
          path: baseline/asset-management
          fetch-depth: 1

      - name: Run the baseline and compare
        if: ${{ inputs.baseline_ref != '' }}
        run: |
          # the other two repositories are the same in both runs
          ln -s "$PWD/repos/calibrationFiles" baseline/calibrationFiles
          ln -s "$PWD/repos/deployments" baseline/deployments
          verify-metadata \
            --asset-management '${{ inputs.asset_management_repo }}@${{ inputs.baseline_ref }}' \
            --calibration-files 'OOI-CabledArray/calibrationFiles@${{ inputs.calibration_files_ref }}' \
            --deployments 'OOI-CabledArray/deployments@main' \
            --clones baseline \
            --out reports/baseline.json
          compare-metadata reports/baseline.json "$REPORT" --out "$COMPARISON"

      # Kept whether or not it is published, so a run that was only a look can
      # still be read back.
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: metadata-report
          path: reports/

      # Published runs live in git rather than in a bucket. They are what the
      # dashboard serves, the history is the provenance record, and an earlier
      # run stays reachable as a baseline without anything to administer.
      - name: Commit the report
        if: ${{ inputs.publish }}
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          cp "$REPORT" "reports/report_$stamp.json"
          cp "$REPORT" reports/latest.json
          # The index is what lets the dashboard offer an earlier run.
          index-metadata --report "$REPORT" --name "report_$stamp.json" \
            --index reports/index.json --out reports/index.json
          # Named twice for the same reason the report is: the dashboard reads
          # one fixed url, and the stamped copy keeps the run reachable after
          # the next one replaces it.
          if [ -f "$COMPARISON" ]; then cp "$COMPARISON" "reports/comparison_$stamp.json"; fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f reports/latest.json reports/index.json "reports/report_$stamp.json" \
            $([ -f "$COMPARISON" ] && echo "$COMPARISON reports/comparison_$stamp.json")
          git commit -m "Verification run $stamp

          asset-management ${{ inputs.asset_management_repo }}@${{ inputs.asset_management_ref }}
          calibrationFiles @${{ inputs.calibration_files_ref }}"
          # Another run may have published while this one was working.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
